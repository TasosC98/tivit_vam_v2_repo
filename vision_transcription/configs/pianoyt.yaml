# PianoYT visual (video-only) piano transcription.
#
# Same model/pipeline as the pinned PianoVAM winner (configs/tiled_best.yaml),
# but pointed at the PianoYT dataset. The differences from PianoVAM live entirely
# in the `data:` block (see data.format below); the model/train/decode blocks are
# identical, so results are directly comparable across the two datasets.
#
# Run it exactly like the PianoVAM experiment:
#   CONFIG=configs/pianoyt.yaml bash scripts/run_experiment.sh pianoyt_tiled tiled train.num_workers=0
#
# Server profile (paths + cpu/gpu) is auto-selected by hostname.
profile: auto
profiles:
  dit:                         # CPU server
    hostname: vdcloud
    overrides:
      data.root: /home/mkoziri/datasets/PianoYT      # <-- adjust to where PianoYT lives
      train.device: cpu
  dib:                         # GPU server
    hostname: gondor
    overrides:
      data.root: /raid_storage/data_achatzigiannis/PianoYT   # <-- adjust
      train.device: cuda

data:
  format: pianoyt             # <-- selects the PianoYT loaders (csv metadata + MIDI labels)
  root: /raid_storage/data_achatzigiannis/PianoYT
  metadata: pianoyt.csv       # id, url, split(1=train/3=test), min_y, max_y, min_x, max_x
  video_dir: raw_videos       # videos at raw_videos/<video_pattern>
  midi_dir: pianoyt_MIDI      # labels at pianoyt_MIDI/<midi_pattern>
  video_ext: .mp4             # generic fallback ext (unused when video_pattern is set)
  video_pattern: "video_{id}.0.mp4"   # video filename, e.g. video_100.0.mp4
  midi_pattern: "audio_{id}.0.midi"   # MIDI label filename, e.g. audio_100.0.midi
  # PianoYT ships only train(1)/test(3). Hold out this fraction of train as a
  # deterministic 'valid' split (for threshold calibration). Change valid_seed
  # to reshuffle which recordings land in valid.
  valid_frac: 0.1
  valid_seed: 1234
  train_splits: [train]
  valid_splits: [valid]
  test_splits:  [test]
  # record ids (as strings) to drop entirely, e.g. bad crops. Missing videos or
  # MIDIs are skipped automatically, so they need NOT be listed here.
  exclude_records: []

keyboard:
  # PianoYT gives an axis-aligned crop box, so the "perspective" warp is a plain
  # crop + resize. Keep width >> height (88-key aspect ~8:1). 1408/16 = 88 -> one
  # CNN feature column per key (the PianoVAM winner).
  warp_width: 1408
  warp_height: 112
  grayscale: false
  # PianoYT videos vary in native resolution/fps (YouTube). decode_height scales
  # the frame (and the crop corners) down for RAM/speed; 0 = native resolution.
  decode_height: 360
  read_chunk: 8

labels:
  fps: 30.0                   # target label/inference rate (video subsampled to this)
  pitch_min: 21
  pitch_max: 108
  # PianoYT labels are MIDI (note-on/off only): the note-off offset includes
  # sustain-pedal tails a camera cannot see, so onset+pitch (onset_f1) is the
  # fair metric; onset+offset (full_f1) will read low. offset_field is unused
  # for MIDI labels and kept only for config symmetry with PianoVAM.
  offset_field: key_offset
  onset_window_frames: 2
  min_note_frames: 1

model:
  arch: tiled                 # per-key ROI architecture (the PianoVAM winner)
  encoder_channels: [32, 64, 128, 192]
  feature_dim: 256
  gru_hidden: 256
  gru_layers: 2
  dropout: 0.2
  use_velocity: false
  tile_feature_dim: 64
  tile_gru_hidden: 128

train:
  clip_len: 32
  clip_hop: 16
  batch_size: 8
  num_workers: 2              # 0 = ultra-safe; raise on a healthy box for speed
  max_open_readers: 2
  max_cached_targets: 8
  epochs: 20
  lr: 0.0006
  weight_decay: 0.0001
  amp: true
  grad_clip: 3.0
  onset_pos_weight: 8.0
  frame_pos_weight: 2.0
  velocity_loss_weight: 1.0
  log_every: 20
  eval_every_epochs: 1
  seed: 1234
  out_dir: runs/pianoyt_tiled
  device: auto
  # ~20 s per recording (600 frames at 30 fps) is the proven subset; 0 = full videos.
  max_frames_per_record: 600

decode:
  onset_threshold: 0.5        # calibrate on the (held-out) valid split after training
  frame_threshold: 0.5
  default_velocity: 80
  min_duration_s: 0.03

infer:
  window_frames: 512
  window_hop: 448
